# Build and test on every push and pull request. The root artifacts are public packages in
# GitHub Packages; reading them needs a token, the workflow's own GITHUB_TOKEN is enough.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build and test
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: start.sh syntax
        run: sh -n start.sh
