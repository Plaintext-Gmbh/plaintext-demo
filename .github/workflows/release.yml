# Tag vX.Y.Z -> build with tests, attach plaintext-demo-X.Y.Z.jar (+ .sha256) to the GitHub release.
# start.sh downloads the jar of the latest release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build with the tag's version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true
          mvn -B verify
          mkdir -p dist
          cp "plaintext-demo-webapp/target/plaintext-demo-webapp-$VERSION.jar" "dist/plaintext-demo-$VERSION.jar"
          (cd dist && sha256sum "plaintext-demo-$VERSION.jar" > "plaintext-demo-$VERSION.jar.sha256")
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "plaintext-demo ${GITHUB_REF_NAME#v}" --generate-notes
          fi
